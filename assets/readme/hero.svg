<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MuSlice</title>
  <desc id="desc">Design transmission SXRD and SAXS sample thickness from X-ray attenuation using Beer-Lambert and xraydb.</desc>
  <rect width="1200" height="360" rx="26" fill="#0E2438"/>
  <path d="M0 54H1200M690 0V360" stroke="#1C3A54"/>
  <g transform="translate(56 42)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text fill="#7FA3C0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="2.2">SXRD · SAXS · TRANSMISSION DESIGN</text>
    <text y="104" fill="#F3F0E7" font-family="Georgia,'Times New Roman',serif" font-size="68" font-weight="700" letter-spacing="-1.2">MuSlice</text>
    <text y="154" fill="#C2D4E4" font-size="23">Design the sample thickness that lets the beam through.</text>
    <path d="M0 182H480" stroke="#2A4A66"/>
    <g transform="translate(0 216)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
      <text fill="#F3F0E7">μ/ρ</text>
      <text x="72" fill="#7FA3C0">T or μt</text>
      <text x="176" fill="#7FA3C0">STACK</text>
      <text x="268" fill="#7FA3C0">SESSION JSON</text>
    </g>
    <text y="274" fill="#6A8AA8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">Beer–Lambert · xraydb · MIT</text>
  </g>
  <g transform="translate(730 50)">
    <rect width="410" height="260" fill="#0A1C2E" stroke="#2A4A66"/>
    <!-- beam -->
    <path d="M24 120 H150" stroke="#5EC8FF" stroke-width="3" opacity="0.35"/>
    <path d="M260 120 H386" stroke="#5EC8FF" stroke-width="3" opacity="0.55"/>
    <rect x="150" y="70" width="110" height="100" fill="#132A42" stroke="#5EC8FF" stroke-width="1.8"/>
    <text x="188" y="126" fill="#9FD8FF" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">t</text>
    <text x="36" y="112" fill="#7FA3C0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">I₀</text>
    <text x="340" y="112" fill="#7FA3C0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">I</text>
    <!-- T(t) -->
    <polyline points="40,230 90,210 140,194 190,182 240,174 290,168 340,164" fill="none" stroke="#8FE3B8" stroke-width="2.2"/>
    <text x="40" y="250" fill="#6A8AA8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">T(t) · target transmission or μt</text>
  </g>
  <text x="1144" y="336" text-anchor="end" fill="#4A6A88" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">D-sudoasd / MuSlice</text>
</svg>
