[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "muslice"
version = "1.0.0"
description = "MuSlice — design SXRD/SAXS sample thickness from X-ray attenuation (μt)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MuSlice contributors" }]
keywords = ["SXRD", "SAXS", "X-ray", "attenuation", "thickness", "Beer-Lambert", "synchrotron"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "xraydb>=4.5",
  "numpy>=1.22",
  "matplotlib>=3.5",
]

[project.optional-dependencies]
theme = ["sv-ttk>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
muslice = "muslice.app:main"

[project.urls]
Homepage = "https://github.com/D-sudoasd/MuSlice"
Repository = "https://github.com/D-sudoasd/MuSlice"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
